[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cronlint"
version = "0.1.0"
description = "A linter for cron expressions that reports findings with line numbers"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "jwilliams94" }]
dependencies = []

[tool.setuptools.packages.find]
include = ["cronlint*"]
